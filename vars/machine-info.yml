google_project_id: devops-505705
# Remote login user created on the VMs via the ssh-keys metadata
user: g700ghosty
# Control-node (this Mac) paths
adc_path: "{{ lookup('env', 'HOME') }}/.config/gcloud/application_default_credentials.json"
ssh_public_key: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"

# Environment for every google.cloud task
gcp_env:
  GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_path }}"
  GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES: "1"

# Network the machines and firewall rules belong to
gcp_network: "projects/{{ google_project_id }}/global/networks/default"

# Where the generated inventory is written (relative to the project root)
inventory_output: "{{ playbook_dir }}/../inventory.ini"

# Define the machine spec
# e2-standard-2 = 2 vCPU / 8 GB RAM (SonarQube & Nexus need >= 4 GB)
machine_spec:
  standard:
    machine_type: "e2-standard-2"
    zone: "asia-southeast1-c"
    disk_size: 50
    disk_type: pd-standard

# Define OS
ubuntu_spec:
  v22:
    image: "projects/ubuntu-os-cloud/global/images/family/ubuntu-2204-lts"
  v24:
    image: "projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64"

# Define Machine info
# GCP instance names must be lowercase: [a-z]([-a-z0-9]*[a-z0-9])?
# role = inventory group the machine is placed in
machine_info:
  - name: "jenkins01"
    role: jenkins
    machine_type: "{{ machine_spec.standard.machine_type }}"
    zone: "{{ machine_spec.standard.zone }}"
    disk_size: "{{ machine_spec.standard.disk_size }}"
    disk_type: "{{ machine_spec.standard.disk_type }}"
    image: "{{ ubuntu_spec.v24.image }}"

  - name: "sonarqube01"
    role: sonarqube
    machine_type: "{{ machine_spec.standard.machine_type }}"
    zone: "{{ machine_spec.standard.zone }}"
    disk_size: "{{ machine_spec.standard.disk_size }}"
    disk_type: "{{ machine_spec.standard.disk_type }}"
    image: "{{ ubuntu_spec.v24.image }}"

  - name: "nexus01"
    role: nexus
    machine_type: "{{ machine_spec.standard.machine_type }}"
    zone: "{{ machine_spec.standard.zone }}"
    disk_size: "{{ machine_spec.standard.disk_size }}"
    disk_type: "{{ machine_spec.standard.disk_type }}"
    image: "{{ ubuntu_spec.v24.image }}"
